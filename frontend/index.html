<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Urania · 知识点点名册</title>

  <!-- PWA：手机上「添加到桌面」用 -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="icon" href="/assets/icon-192.png" type="image/png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Urania">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e22" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app">
    <!-- 顶部工具栏：大标题 + 分段控件（macOS HIG segmented control） -->
    <header class="titlebar">
      <div class="titlebar-left">
        <h1 class="app-title">Urania</h1>
        <p class="app-subtitle">知识点点名册</p>
      </div>

      <nav class="segmented" role="tablist" aria-label="主导航">
        <button class="seg-btn is-active" data-view="draw" role="tab" aria-selected="true">抽取新知识</button>
        <button class="seg-btn" data-view="review" role="tab" aria-selected="false">复习</button>
        <button class="seg-btn" data-view="stats" role="tab" aria-selected="false">统计</button>
      </nav>

      <div class="titlebar-right">
        <span class="count-chip" id="unlearned-chip" title="未学习知识点数量">…</span>
      </div>
    </header>

    <main id="main" class="main" aria-live="polite">
      <p class="loading">载入中…</p>
    </main>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="/js/app.js"></script>
</body>
</html>
